name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Newest Minecraft and Fabric versions
        run: |
          echo "Minecraft: $(curl -s https://piston-meta.mojang.com/mc/game/version_manifest_v2.json | jq -c .latest)"
          echo "Fabric game versions: $(curl -s https://meta.fabricmc.net/v2/versions/game | jq -c '[.[] | select(.stable)][0:3] | map(.version)')"
          echo "Fabric loader: $(curl -s https://meta.fabricmc.net/v2/versions/loader | jq -r '.[0].version')"
          echo "Fabric API: $(curl -s https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml | grep -oE '<version>[^<]+</version>' | sed -E 's/<\/?version>//g' | tail -5 | tr '\n' ' ')"
          echo "ViaFabricPlus for 26.3: $(curl -s 'https://api.modrinth.com/v2/project/viafabricplus/version?game_versions=%5B%2226.3%22%5D' | jq -c '[.[] | {v: .version_number, g: .game_versions}][0:3]')"
          echo "ViaFabricPlus latest: $(curl -s 'https://api.modrinth.com/v2/project/viafabricplus/version' | jq -c '[.[] | {v: .version_number, g: .game_versions[-1]}][0:3]')"

      - name: Build
        run: |
          set -o pipefail
          ./gradlew build 2>&1 | tee build.log

      # Короткая сводка в самом конце лога, чтобы ошибки было легко найти.
      - name: Dump Minecraft API signatures
        if: failure() || contains(github.event.head_commit.message, '[dump]')
        run: tools/dump-api.sh

      - name: Probe API
        if: failure() || contains(github.event.head_commit.message, '[dump]')
        run: tools/probe-api.sh

      - name: Error summary
        if: failure()
        run: grep -E -A4 'error:|What went wrong' build.log | head -150 || true

      - uses: actions/upload-artifact@v4
        with:
          name: VibeClient
          path: |
            launcher/build/libs/VibeLauncher.jar
            client/build/libs/vibe-client-*.jar

  # Отдельно от сборки: если виртуальный экран не потянет игру, dmg всё равно соберётся.
  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      # Запускаем игру с клиентом в виртуальном экране: так ловятся ошибки миксинов,
      # которые компилятор не видит.
      - name: Smoke test (start the game)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri libglx-mesa0 libegl-mesa0 > /dev/null
          export LIBGL_ALWAYS_SOFTWARE=1 MESA_GL_VERSION_OVERRIDE=4.6 SDL_VIDEODRIVER=x11 SDL_VIDEO_FORCE_EGL=1 SDL_VIDEO_X11_FORCE_EGL=1 EGL_PLATFORM=x11
          set +e
          xvfb-run -a -s "-screen 0 1280x720x24 +extension GLX +render -noreset" sh -c "glxinfo -B | head -20; glxinfo -v | grep -m3 -i visual"
          # Без видеокарты размытие фона в меню рисуется минутами, а при первом запуске
          # вместо главного меню показывается экран настроек доступности: отключаем и то, и другое.
          mkdir -p client/run
          printf '%s\n' 'onboardAccessibility:false' 'menuBackgroundBlurriness:0' 'renderDistance:2' \
            'simulationDistance:5' 'narrator:0' 'soundCategory_master:0.0' > client/run/options.txt
          # Если игра застрянет, через 7 минут печатаем дамп потоков, чтобы было видно где.
          (sleep 420; pkill -QUIT -f devlaunchinjector || true) & dump=$!
          # Как только меню открылось, ждём ещё 20 секунд (ловим ошибки отрисовки меню) и закрываем игру,
          # чтобы тест не сидел до таймаута.
          (until grep -q "Главное меню открыто" run.log 2>/dev/null; do sleep 5; done; sleep 20; pkill -f devlaunchinjector || true) & stop=$!
          timeout 600 xvfb-run -a -s "-screen 0 1280x720x24 +extension GLX +render -noreset" ./gradlew :client:runClient --no-daemon > run.log 2>&1
          pkill -P "$dump" 2>/dev/null; pkill -P "$stop" 2>/dev/null; kill "$dump" "$stop" 2>/dev/null
          set -e
          echo "----- important lines -----"
          grep -E "Vibe Client|ViaFabricPlus|Mixin|mixin|Exception|ERROR|Caused by|Sound engine|Backend|OpenGL|Главное меню" run.log | grep -v DEBUG | head -80
          echo "----- tail -----"
          tail -40 run.log
          echo "----- render thread -----"
          grep -A40 '"Render thread"' run.log | head -60 || true
          grep -q "Vibe Client .* загружен" run.log
          grep -q "Главное меню открыто" run.log
          ! grep -qE "MixinApplyError|InvalidInjectionException|Mixin transformation of .* failed|Minecraft has crashed|---- Minecraft Crash Report" run.log

  # Приложение для macOS без Mac-сервера: .app со встроенной Java для Apple Silicon и Intel.
  macos-app:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: VibeClient
          path: artifact

      - name: Build Vibe Client.app
        run: |
          set -eu
          app="dist/Vibe Client.app/Contents"
          mkdir -p "$app/MacOS" "$app/Resources"
          cp artifact/launcher/build/libs/VibeLauncher.jar "$app/Resources/"
          for arch in aarch64 x64; do
            curl -fsSL -o jre-$arch.tar.gz "https://api.adoptium.net/v3/binary/latest/21/ga/mac/$arch/jre/hotspot/normal/eclipse"
            mkdir -p jre-$arch && tar -xzf jre-$arch.tar.gz -C jre-$arch --strip-components=1
            mv jre-$arch "$app/Resources/jre-$arch"
          done
          sudo apt-get install -y -qq icnsutils > /dev/null && png2icns "$app/Resources/VibeClient.icns" client/src/main/resources/assets/vibe-client/icon.png || true
          cat > "$app/MacOS/VibeClient" <<'SH'
          #!/bin/sh
          # Запускает лаунчер на встроенной Java под процессор этого Mac.
          dir="$(cd "$(dirname "$0")/.." && pwd)"
          case "$(uname -m)" in arm64) jre="$dir/Resources/jre-aarch64" ;; *) jre="$dir/Resources/jre-x64" ;; esac
          exec "$jre/Contents/Home/bin/java" -Dapple.awt.application.name=VibeClient -Xdock:name="Vibe Client" \
            -Xdock:icon="$dir/Resources/VibeClient.icns" -jar "$dir/Resources/VibeLauncher.jar" "$@"
          SH
          sed -i 's/^          //' "$app/MacOS/VibeClient"
          chmod +x "$app/MacOS/VibeClient"
          cat > "$app/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Vibe Client</string>
            <key>CFBundleDisplayName</key><string>Vibe Client</string>
            <key>CFBundleIdentifier</key><string>vibe.client.launcher</string>
            <key>CFBundleVersion</key><string>1.0.0</string>
            <key>CFBundleShortVersionString</key><string>1.0.0</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleExecutable</key><string>VibeClient</string>
            <key>CFBundleIconFile</key><string>VibeClient.icns</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          sed -i 's/^          //' "$app/Info.plist"
          head -3 "$app/MacOS/VibeClient"
          (cd dist && zip -qry ../VibeClient-mac.zip "Vibe Client.app")
          ls -la VibeClient-mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: VibeClient-mac-app
          path: VibeClient-mac.zip

  # Свежая сборка в Releases, чтобы скачать по прямой ссылке.
  release:
    needs: [build, macos-app]
    if: github.event_name == 'push' && github.ref == 'refs/heads/claude/project-thread-47mu48'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          find artifacts -type f
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly --prerelease --target "${{ github.sha }}" \
            --title "Vibe Client (свежая сборка)" \
            --notes "Автосборка из ${{ github.sha }}. macOS: VibeClient-mac.zip (распаковать и перетащить в Программы) или VibeClient.dmg, когда он появится. Другие системы: VibeLauncher.jar (нужна Java 17+)." \
            artifacts/VibeClient-mac-app/VibeClient-mac.zip \
            artifacts/VibeClient/launcher/build/libs/VibeLauncher.jar

  # Приложение для macOS со встроенной Java: Java ставить не нужно.
  # Mac-серверов на GitHub бывает мало: dmg собирается после релиза и докладывается в него,
  # а пока его нет, в релизе уже лежит VibeClient-mac.zip, собранный на Linux.
  macos:
    needs: release
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: VibeClient
          path: artifact

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Icon
        run: |
          mkdir -p icon.iconset
          for size in 16 32 64 128 256 512; do
            sips -z $size $size client/src/main/resources/assets/vibe-client/icon.png --out icon.iconset/icon_${size}x${size}.png > /dev/null
          done
          iconutil -c icns icon.iconset -o VibeClient.icns

      - name: Package dmg
        run: |
          mkdir -p input
          cp artifact/launcher/build/libs/VibeLauncher.jar input/
          jpackage --type dmg \
            --name "Vibe Client" \
            --app-version 1.0.0 \
            --vendor "Vibe Client" \
            --input input \
            --main-jar VibeLauncher.jar \
            --main-class vibe.launcher.Main \
            --icon VibeClient.icns \
            --java-options "-Dapple.awt.application.name=VibeClient" \
            --dest dist
          mv dist/*.dmg dist/VibeClient.dmg
          ls -la dist

      - name: Add dmg to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload nightly dist/VibeClient.dmg --clobber
