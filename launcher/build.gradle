plugins {
    id 'java'
    id 'application'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

// Собранный клиент вшивается в лаунчер и при запуске кладётся в mods.
if (findProject(':client') != null) {
    processResources {
        from(project(':client').tasks.named('jar')) {
            into 'client'
            rename { 'vibe-client.jar' }
        }
    }
}

dependencies {
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'com.formdev:flatlaf:3.5.4'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'vibe.launcher.Main'
}

test {
    useJUnitPlatform()
}

// Один исполняемый jar со всеми зависимостями: VibeLauncher.jar
tasks.register('fatJar', Jar) {
    group = 'build'
    archiveBaseName = 'VibeLauncher'
    archiveVersion = ''
    manifest {
        attributes 'Main-Class': application.mainClass.get(),
                'Implementation-Version': project.version
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from sourceSets.main.output
    dependsOn configurations.runtimeClasspath
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    } {
        exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/versions/**/module-info.class', 'module-info.class'
    }
}

build.dependsOn fatJar
