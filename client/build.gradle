plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
    archivesName = 'vibe-client'
}

repositories {
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Вход на серверы других версий (1.7–26.x). Вшивается внутрь vibe-client.jar, отдельным модом не ставится.
    // Лицензия GPL-3.0: при раздаче клиента исходники тоже нужно открыть.
    implementation "maven.modrinth:viafabricplus:${project.viafabricplus_version}"
    include "maven.modrinth:viafabricplus:${project.viafabricplus_version}"
}

processResources {
    def version = project.version
    def minecraftVersion = project.minecraft_version
    inputs.property 'version', version
    inputs.property 'minecraft_version', minecraftVersion
    filesMatching('fabric.mod.json') {
        expand 'version': version, 'minecraft_version': minecraftVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}
